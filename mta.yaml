# BTP deployment shape (pattern from cap-js/agents bookshop sample).
# Not deployed in this demo — shows how the modules wire up on CF/Kyma:
# approuter (web client, XSUAA login) → srv-api destination → CAP server;
# HANA for persistence, AI Core for real models (llm-mock is local-only).
# Build: `mbt build` (runs `cds build --production`, see before-all).
_schema-version: 3.3.0
ID: cap-ai-131-010-0999
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm ci --prefix app/web
        - npm run build --prefix app/web
        - npx -y -p @sap/cds-dk cds build --production

modules:
  - name: demo-srv
    type: nodejs
    path: gen/srv
    build-parameters: { builder: npm-ci }
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
    provides:
      - name: srv-api
        properties: { srv-url: '${default-url}' }
    requires:
      - name: demo-auth
      - name: demo-db
      - name: demo-ai

  - name: demo-db-deployer
    type: hdb
    path: gen/db
    build-parameters: { builder: npm-ci }
    requires:
      - name: demo-db

  - name: demo-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      disk-quota: 256M
      memory: 256M
    requires:
      - name: demo-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: demo-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
  - name: demo-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: demo-ai
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
