<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Agent — UI5 A2A client</title>

<!-- Classic SAP UI5 bootstrap from CDN: zero build, zero bundlers -->
<script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-xx-waitForTheme="true"></script>

<style>
  .chatMsgUser   { align-self: flex-end; background: #dbe7ff; border-radius: 12px; padding: 8px 12px; max-width: 75%; }
  .chatMsgAgent  { align-self: flex-start; background: #eff1f5; border-radius: 12px; padding: 8px 12px; max-width: 75%; }
  .chatVBox      { padding: 12px; }
</style>
</head>
<body class="sapUiBody" id="content"></body>

<script>
/* BTP-style UI5 client: talks to CAP ONLY through the App Router
   (destination srv-api). On BTP the same route is XSUAA-protected. */
const ENDPOINT = '/agent/agents/notes'
const contextId = crypto.randomUUID()

// BTP CSRF dance: fetch a token once, send it on every mutating call
let csrfToken = ''
async function fetchCsrf() {
  const r = await fetch(ENDPOINT, { headers: { 'X-CSRF-Token': 'fetch' } })
  csrfToken = r.headers.get('x-csrf-token') ?? ''
}

async function sendToAgent(text) {
  await fetchCsrf()
  const r = await fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
    body: JSON.stringify({
      jsonrpc: '2.0', id: Date.now(), method: 'message/send',
      params: { message: { role: 'user', kind: 'message', messageId: crypto.randomUUID(), contextId, parts: [{ kind: 'text', text }] } }
    })
  })
  const body = await r.json()
  const parts = body?.result?.status?.message?.parts ?? []
  return parts.map(p => p.text).join('\n') || JSON.stringify(body?.error ?? body)
}

sap.ui.getCore().attachInit(() => {
  const sapm = sap.m
  const chatBox = new sapm.VBox({ class: 'chatVBox', alignItems: 'Stretch' })

  function add(role, text) {
    chatBox.addItem(new sapm.HBox({
      justifyContent: role === 'user' ? 'End' : 'Start',
      items: [new sapm.Text({ text, wrapping: true }).addStyleClass(role === 'user' ? 'chatMsgUser' : 'chatMsgAgent')]
    }))
  }

  const input = new sapm.Input({ placeholder: 'Ask the agent…', width: '100%' })
  const sendBtn = new sapm.Button({ icon: 'sap-icon://send', type: 'Emphasized', press: send })

  async function send() {
    const text = (input.getValue() || '').trim()
    if (!text) return
    add('user', text)
    input.setValue('')
    oPage.setBusy(true)
    try {
      add('agent', await sendToAgent(text))
    } catch (err) {
      add('agent', '⚠️ ' + err.message)
    } finally {
      oPage.setBusy(false)
    }
  }
  input.attachSubmit(send)

  const footer = new sapm.Bar({
    contentMiddle: [input],
    contentRight: [sendBtn]
  })

  var oPage = new sapm.Page({
    title: 'Notes Agent — UI5 · A2A 0.3.0 · via App Router',
    showHeader: true,
    content: [new sapm.ScrollContainer({ height: '100%', vertical: true, content: [chatBox] })],
    footer
  })

  add('agent', 'Ask me about your notes. (llm-mock answers — no API key involved.)')

  new sapm.App({ initialPage: oPage.getId(), pages: [oPage] }).placeAt('content')
})
</script>
</html>
