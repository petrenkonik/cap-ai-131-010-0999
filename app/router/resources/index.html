<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Agent — A2A client</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e6e6e6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; border-bottom: 1px solid #26293a; font-weight: 600; }
  header small { display: block; color: #8b8fa3; font-weight: 400; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2b4a8f; }
  .agent { align-self: flex-start; background: #23263a; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #26293a; }
  input { flex: 1; background: #1a1d2b; border: 1px solid #33374d; color: inherit; border-radius: 8px; padding: 10px; }
  button { background: #2b4a8f; color: white; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>Notes Agent <small>A2A 0.3.0 · JSON-RPC · via App Router → srv-api</small></header>
<div id="chat"></div>
<form id="f">
  <input id="t" placeholder="Ask the agent…" autocomplete="off">
  <button id="b">Send</button>
</form>
<script>
  // BTP-style client: talks to the CAP backend ONLY through the App Router
  // (destination srv-api). On BTP the same route is protected by XSUAA.
  const ENDPOINT = '/agent/agents/notes'
  const chat = document.getElementById('chat'), t = document.getElementById('t'), b = document.getElementById('b')
  const contextId = crypto.randomUUID()

  // BTP-style CSRF dance: fetch a token once, send it on every mutating call
  let csrfToken = ''
  async function fetchCsrf() {
    const r = await fetch(ENDPOINT, { headers: { 'X-CSRF-Token': 'fetch' } })
    csrfToken = r.headers.get('x-csrf-token') ?? ''
  }

  function add(role, text) {
    const div = document.createElement('div')
    div.className = 'msg ' + role
    div.textContent = text
    chat.appendChild(div)
    chat.scrollTop = chat.scrollHeight
  }

  document.getElementById('f').onsubmit = async e => {
    e.preventDefault()
    const text = t.value.trim()
    if (!text) return
    add('user', text)
    t.value = ''
    b.disabled = true
    try {
      await fetchCsrf()
      const r = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
        body: JSON.stringify({
          jsonrpc: '2.0', id: Date.now(), method: 'message/send',
          params: { message: { role: 'user', kind: 'message', messageId: crypto.randomUUID(), contextId, parts: [{ kind: 'text', text }] } }
        })
      })
      const body = await r.json()
      const parts = body?.result?.status?.message?.parts ?? []
      const out = parts.map(p => p.text).join('\n') || JSON.stringify(body?.error ?? body)
      add('agent', out)
    } catch (err) {
      add('agent', '⚠️ ' + err.message)
    } finally {
      b.disabled = false
    }
  }
  add('agent', 'Ask me about your notes. (llm-mock answers — no API key involved.)')
</script>
</body>
</html>
